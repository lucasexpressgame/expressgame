<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Express Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: una grilla de rectángulos grandes, nada más */
:root{
  --bg:#f3f4f7; --card:#ffffff; --fg:#1a1d26; --muted:#606778; --line:#dde0e8;
  --accent:#3a4fd8; --accent-soft:#e6e9fb; --warn:#a15c00;
  --display:"Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141b; --card:#1b1e28; --fg:#e9ebf2; --muted:#9aa1b3; --line:#2c303d;
  --accent:#8c9bff; --accent-soft:#252b4d; --warn:#f0b35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141b; --card:#1b1e28; --fg:#e9ebf2; --muted:#9aa1b3; --line:#2c303d;
  --accent:#8c9bff; --accent-soft:#252b4d; --warn:#f0b35a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-size:1.8rem;margin:0;letter-spacing:-.01em;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:460px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;
  min-height:130px;padding:18px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;
  font:inherit;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
a.tile:hover,button.tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgb(0 0 0 / .08)}
.tile:focus-visible,button:focus-visible,input:focus{outline:2px solid var(--accent);outline-offset:2px}
.tile b{font-family:var(--display);font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:.82rem}
.tile.nolink{border-style:dashed;cursor:default}
.tile.nolink small{color:var(--warn)}
.tile.add{border-style:dashed;color:var(--accent);background:transparent}
body.editing .tile:not(.add){border-color:var(--accent);border-style:dashed;cursor:pointer}
.foot{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.foot button{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 12px;cursor:pointer}
#msg{font-size:.85rem;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:0;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(0 0 0 / .4)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:20px}
dialog h3{font-family:var(--display);margin:0}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row .left{margin-right:auto}
.row button{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.row .primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.row .danger{color:#c0392b}
.tile{background:var(--tc,var(--card));color:var(--ti,var(--fg));border:none;gap:10px;min-height:140px;box-shadow:0 2px 0 rgb(0 0 0 / .12)}
.tile svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile small{color:inherit;opacity:.85}
.tile.nolink{opacity:.55;border:none}
.tile.nolink small{color:inherit}
.tile.add{background:transparent;color:var(--accent);border:2px dashed var(--line);box-shadow:none}
a.tile:hover,button.tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgb(0 0 0 / .18);border:none}
body.editing .tile:not(.add){outline:2px dashed var(--fg);outline-offset:3px;border:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px}
.brand h1{font-family:var(--body);font-weight:800;font-size:1.9rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand h1 span{color:#E51B2A}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.stripe{display:flex;justify-content:center;gap:6px}
.stripe i{width:22px;height:5px;border-radius:3px}
.ghead{grid-column:1/-1;margin:14px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:10px}
.ghead::after{content:"";flex:1;height:1px;background:var(--line)}
.grid.sub{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:460px){.grid.sub{grid-template-columns:1fr 1fr}}
.tile.sm{min-height:84px;padding:12px 10px;gap:6px}
.tile.sm svg{width:24px;height:24px}
.tile.sm b{font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>Express <span>Game</span></h1><p>Diversión ilimitada</p></div>
  <div class="stripe" aria-hidden="true"><i style="background:#E51B2A"></i><i style="background:#4897D3"></i><i style="background:#50BBB4"></i><i style="background:#F6A023"></i></div>
  <div id="grid" class="grid"></div>
  <div class="foot">
    <button id="toggleEdit" type="button" hidden>Editar accesos</button>
    <button id="login" type="button" hidden>Entrar como dueño</button>
    <span id="msg" role="status"></span>
  </div>
</div>
<dialog id="dlg">
  <form id="f" method="dialog">
    <h3 id="dlgTitle">Agregar acceso</h3>
    <label>Nombre <input id="fName" required maxlength="40"></label>
    <label>Link <input id="fUrl" placeholder="https://…"></label>
    <label>Aclaración corta (opcional) <input id="fDesc" maxlength="50"></label>
    <label>Fila de abajo (opcional, ej: Trello) <input id="fGroup" maxlength="30" placeholder="Vacío = botones grandes de arriba"></label>
    <div class="row">
      <button id="del" class="left danger" type="button">Borrar</button>
      <button id="cancel" type="button">Cancelar</button>
      <button class="primary" type="submit">Guardar</button>
    </div>
  </form>
</dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
let accesos=[], canEdit=false, editIdx=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(u){u=u||'';if(/^https:\/\//i.test(u))return u;if(/^[a-z0-9_-]+\/?$/i.test(u))return u;return ''}
function clean(v){return (Array.isArray(v)?v:[]).filter(x=>x&&x.n).map(x=>({n:String(x.n),u:String(x.u||''),d:String(x.d||''),g:String(x.g||'')}))}
function say(t){$('msg').textContent=t}

const ICONS={"box": "<path d=\"M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z\"/><path d=\"M3 7.5 12 12l9-4.5M12 12v9\"/>", "calc": "<rect x=\"5\" y=\"2.5\" width=\"14\" height=\"19\" rx=\"2.5\"/><path d=\"M8 6.5h8v3H8zM8.5 13h.01M12 13h.01M15.5 13h.01M8.5 17h.01M12 17h.01M15.5 17h.01\"/>", "wrench": "<path d=\"M14.5 6.5a4 4 0 0 0 5 5L13 18a2.1 2.1 0 1 1-3-3l6.5-6.5a4 4 0 0 0-2-2z\"/><path d=\"M14.5 6.5 17 4l3 3-2.5 2.5\"/>", "globe": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"/>", "orders": "<rect x=\"5\" y=\"3.5\" width=\"14\" height=\"18\" rx=\"2\"/><path d=\"M9 3.5h6v3H9zM8.5 11h7M8.5 14.5h7M8.5 18h4\"/>", "cart": "<path d=\"M3 4h2.5l2.2 10.5h10.6L20.5 7H7\"/><circle cx=\"9.5\" cy=\"19\" r=\"1.4\"/><circle cx=\"17\" cy=\"19\" r=\"1.4\"/>", "board": "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/><rect x=\"6.5\" y=\"6.5\" width=\"4\" height=\"10\" rx=\"1\"/><rect x=\"13.5\" y=\"6.5\" width=\"4\" height=\"6\" rx=\"1\"/>", "chat": "<path d=\"M4 20l1.3-3.9A8 8 0 1 1 8 19z\"/><path d=\"M9 9.5c0 3 2.5 5.5 5.5 5.5\"/>", "link": "<path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1\"/><path d=\"M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"/>"};
const LOOKS=[[/iduo/i,'#E51B2A','box'],[/calcul/i,'#F6A023','calc'],[/repara|técnic|tecnic/i,'#3FA9A2','wrench'],[/admin|pedido/i,'#2D2A5E','orders'],[/p[aá]gina|web|tienda/i,'#4897D3','globe'],[/mercado ?libre/i,'#FFE14D','cart'],[/trello/i,'#1F5FB0','board'],[/whats/i,'#1FAF5B','chat']];
const SPARE=['#E51B2A','#4897D3','#3FA9A2','#F6A023','#2D2A5E'];
function look(n,i){for(const [re,c,ic] of LOOKS)if(re.test(n))return {c,ic};return {c:SPARE[i%SPARE.length],ic:'link'}}
function ink(c){const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>170?'#1A1837':'#ffffff'}
function icon(k){return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.link}</svg>`}
const editing=()=>document.body.classList.contains('editing');
function tileHtml(it,i,small){const url=safeUrl(it.u),ext=/^https:/.test(url);
    const L=it.g?{c:'#1F5FB0',ic:'board'}:look(it.n,i), st=`style="--tc:${L.c};--ti:${ink(L.c)}"`, cls='tile'+(small?' sm':'');
    const inner=`${icon(L.ic)}<b>${esc(it.n)}</b>${url?(it.d?`<small>${esc(it.d)}</small>`:''):'<small>Falta el link</small>'}`;
    if(editing())return `<button type="button" class="${cls}" ${st} data-i="${i}">${inner}</button>`;
    return url?`<a class="${cls}" ${st} href="${esc(url)}"${ext?' target="_blank" rel="noopener"':''}>${inner}</a>`:`<div class="${cls} nolink" ${st}>${inner}</div>`}
function render(){
  const idx=accesos.map((it,i)=>({it,i}));
  let h=idx.filter(x=>!x.it.g).map(x=>tileHtml(x.it,x.i,false)).join('');
  if(editing())h+=`<button type="button" class="tile add" id="addTile"><b>+ Agregar</b></button>`;
  const groups=[...new Set(accesos.filter(a=>a.g).map(a=>a.g))];
  for(const g of groups)h+=`<h2 class="ghead">${esc(g)}</h2><div class="grid sub">${idx.filter(x=>x.it.g===g).map(x=>tileHtml(x.it,x.i,true)).join('')}</div>`;
  $('grid').innerHTML=h;
  $('toggleEdit').hidden=!canEdit;
  if(!canEdit&&editing()){document.body.classList.remove('editing')}
}
function openDlg(i){editIdx=i;const it=i==null?{n:'',u:'',d:'',g:''}:accesos[i];
  $('dlgTitle').textContent=i==null?'Agregar acceso':'Editar acceso';
  $('fName').value=it.n;$('fUrl').value=it.u;$('fDesc').value=it.d;$('fGroup').value=it.g||'';$('del').hidden=i==null;$('dlg').showModal()}
$('grid').addEventListener('click',e=>{if(!editing())return;const b=e.target.closest('button');if(!b)return;
  if(b.id==='addTile')openDlg(null);else if(b.dataset.i!=null)openDlg(+b.dataset.i)});
$('cancel').onclick=()=>$('dlg').close();
let delArmed=false;
$('del').onclick=()=>{if(!delArmed){delArmed=true;$('del').textContent='¿Seguro? Tocá de nuevo';return}
  accesos.splice(editIdx,1);$('dlg').close();render();save()};
$('dlg').addEventListener('close',()=>{delArmed=false;$('del').textContent='Borrar'});
$('f').addEventListener('submit',e=>{e.preventDefault();
  let u=$('fUrl').value.trim();if(u&&!/^https?:\/\//i.test(u)&&!/^[a-z0-9_-]+\/?$/i.test(u))u='https://'+u;u=u.replace(/^http:\/\//i,'https://');
  const it={n:$('fName').value.trim(),u,d:$('fDesc').value.trim(),g:$('fGroup').value.trim()};if(!it.n)return;
  if(editIdx==null)accesos.push(it);else accesos[editIdx]=it;$('dlg').close();render();save()});
$('toggleEdit').onclick=()=>{document.body.classList.toggle('editing');$('toggleEdit').textContent=editing()?'Listo':'Editar accesos';render()};

// Configuración de Firebase y Gmail del dueño: vienen de config.js (compartido con la calculadora)
const C=window.FIREBASE_CONFIG||{}, OWNER=(window.OWNER_EMAIL||'').toLowerCase();
const DEFAULT=[{"n": "WhatsApp", "u": "https://web.whatsapp.com", "d": "", "g": ""}, {"n": "iDuo", "u": "https://www.iduo.com.ar/Login.html", "d": "", "g": ""}, {"n": "Gestor de reparaciones", "u": "https://gestor-reparaciones-53630.web.app/", "d": "", "g": ""}, {"n": "Mercado Libre", "u": "https://www.mercadolibre.com.ar", "d": "", "g": ""}, {"n": "Calculadora de cobro", "u": "calculadora/", "d": "", "g": ""}, {"n": "Administrador de la página", "u": "https://expressgame4.mitiendanube.com/admin/dashboard", "d": "Pedidos de la página", "g": ""}, {"n": "Página web", "u": "https://www.expressgame.com.ar", "d": "", "g": ""}, {"n": "Express Game", "u": "https://trello.com/b/HNzeqid4/express-game", "d": "", "g": "Trello"}, {"n": "Juegos de PS2", "u": "https://trello.com/b/nPfK0ANQ/juegos-de-ps2", "d": "", "g": "Trello"}, {"n": "Faltante mercadería", "u": "https://trello.com/b/JvbZEhJj/faltante-mercaderia", "d": "", "g": "Trello"}, {"n": "Reparaciones", "u": "https://trello.com/b/8JL9F9tt/reparaciones", "d": "", "g": "Trello"}, {"n": "Datos útiles reparaciones", "u": "https://trello.com/b/hdTUjz3D/datos-utiles-reparaciones", "d": "", "g": "Trello"}, {"n": "Tienda Nube", "u": "https://trello.com/b/I5sIfQqH/tienda-nube", "d": "", "g": "Trello"}];
accesos=clean(DEFAULT);render();
let db=null,auth=null;
try{if(C.projectId&&C.projectId!=='COMPLETAR'){firebase.initializeApp(C);db=firebase.firestore();auth=firebase.auth()}}catch(e){db=null}
async function save(){if(!db||!canEdit)return;say('Guardando…');
  try{await db.doc('panel/config').set({accesos},{merge:true});say('Guardado.')}catch(e){say('No se pudo guardar ('+(e.code||'error')+').')}}
if(db){
  $('login').hidden=false;
  $('login').onclick=()=>{if(auth.currentUser)auth.signOut();else auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>say('No se pudo entrar ('+(e.code||'error')+').'))};
  auth.onAuthStateChanged(u=>{canEdit=!!(u&&u.emailVerified&&(u.email||'').toLowerCase()===OWNER);
    $('login').textContent=u?'Salir':'Entrar como dueño';say(u&&!canEdit?'Esa cuenta no es la del dueño.':'');render()});
  db.doc('panel/config').onSnapshot(d=>{const v=d.exists&&d.data().accesos;if(Array.isArray(v))accesos=clean(v);if(!editing())render()},()=>{});
}
</script>
</body>
</html>
