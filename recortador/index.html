<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recortador de video</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --card:#fff; --ink:#1c1c1a; --mut:#6b6b66; --acc:#2a5bd7; --line:#e2e2dd; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#161615; --card:#222220; --ink:#f0f0ec; --mut:#9b9b94; --acc:#6b95ff; --line:#33332f; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;display:flex;justify-content:center}
  main{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:20px;margin:4px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:28px 14px;text-align:center;color:var(--mut);cursor:pointer}
  .drop.over{border-color:var(--acc);color:var(--acc)}
  .drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
  video,canvas.hid{width:100%;border-radius:10px;background:#000;max-height:50vh}
  canvas.hid{display:none}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row.sp{justify-content:space-between}
  label{font-size:13px;color:var(--mut);display:block;margin-top:10px}
  input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 0}
  .t{font-variant-numeric:tabular-nums;font-weight:600}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--acc)}
  .note{font-size:13px;color:var(--mut)}
  .hide{display:none!important}
  .strip{position:relative;height:56px;margin-top:12px;border-radius:8px;overflow:hidden;background:#000;touch-action:none;cursor:pointer}
  .frames{display:flex;height:100%}
  .frames img{flex:1;min-width:0;height:100%;object-fit:cover;pointer-events:none}
  .sel{position:absolute;top:0;bottom:0;border:3px solid var(--acc);border-radius:6px;background:rgba(42,91,215,.18);pointer-events:none}
  .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px #0009;pointer-events:none}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>Recortador de video</h1>

  <div id="drop" class="drop" tabindex="0">
    <b>Tocá para elegir un video</b>
    o arrastralo hasta acá
    <input id="file" type="file" accept="video/*" class="hide">
  </div>

  <section id="editor" class="card hide">
    <video id="v" playsinline controls preload="metadata"></video>
    <canvas id="c" class="hid"></canvas>

    <div id="strip" class="strip"><div id="frames" class="frames"></div><div id="sel" class="sel"></div><div id="ph" class="ph"></div></div>
    <div id="ticks" class="ticks"></div>
    <p class="note" style="margin:6px 0 0">Tocá o arrastrá sobre la tira para moverte. Ahora: <span id="nowLbl" class="t">0:00.0</span> de <span id="totLbl" class="t">0:00</span></p>

    <label>Inicio: <span id="sLbl" class="t">0:00.0</span></label>
    <input id="s" type="range" min="0" max="1" step="0.1" value="0">
    <label>Fin: <span id="eLbl" class="t">0:00.0</span></label>
    <input id="e" type="range" min="0" max="1" step="0.1" value="1">

    <div class="row" style="margin-top:12px">
      <button id="setS">Inicio = acá</button>
      <button id="setE">Fin = acá</button>
      <button id="prev">▶ Ver recorte</button>
    </div>
    <p class="note" style="margin:10px 0 0">Duración del recorte: <span id="dLbl" class="t">0:00.0</span></p>

    <div class="row" style="margin-top:12px">
      <button id="go" class="pri">Recortar</button>
      <button id="reset">Elegir otro</button>
    </div>
    <p class="note" id="hint">El recorte se graba en tiempo real, así que tarda lo que dura el clip. Dejá esta pantalla abierta.</p>
    <div id="prog" class="bar hide"><i></i></div>
  </section>

  <section id="result" class="card hide">
    <b>Listo</b>
    <video id="rv" playsinline controls style="margin-top:10px"></video>
    <div class="row" style="margin-top:12px">
      <button id="save" class="pri">Descargar</button>
      <span class="note" id="info"></span>
    </div>
    <p class="note" id="msg" style="margin:8px 0 0"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const v = $('v'), cv = $('c'), ctx2d = cv.getContext('2d');
let url = null, outBlob = null, outExt = 'webm', baseName = 'video';
let actx = null, adest = null, asrc = null, busy = false;

const fmt = t => { t = Math.max(0, t); const m = Math.floor(t/60), s = (t%60).toFixed(1).padStart(4,'0'); return m+':'+s; };

function loadFile(f){
  if(!f || !f.type.startsWith('video/')) return;
  if(url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(f);
  baseName = f.name.replace(/\.[^.]+$/,'').slice(0,40) || 'video';
  v.src = url;
  $('result').classList.add('hide');
  outBlob = null;
}
v.addEventListener('loadedmetadata', () => {
  const d = v.duration;
  for(const el of [$('s'),$('e')]){ el.max = d; }
  $('s').value = 0; $('e').value = d;
  $('drop').classList.add('hide'); $('editor').classList.remove('hide');
  upd(); buildStrip();
});
v.addEventListener('error', () => { alert; $('hint').textContent = 'No pude leer este video. Probá con otro formato (MP4 o WebM).'; });

const fmtS = t => Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
let stripTok = 0;
async function buildStrip(){
  const tok = ++stripTok, d = v.duration, N = 8;
  const fr = $('frames'); fr.innerHTML = '';
  const tk = $('ticks'); tk.innerHTML = '';
  for(let i=0;i<=N;i++){ const sp = document.createElement('span'); sp.textContent = fmtS(i/N*d); tk.appendChild(sp); }
  $('totLbl').textContent = fmtS(d);
  const tv = document.createElement('video');
  tv.muted = true; tv.preload = 'auto'; tv.src = url;
  await new Promise(r => { tv.onloadeddata = r; tv.onerror = r; });
  const c = document.createElement('canvas'), h = 112;
  c.height = h; c.width = Math.max(2, Math.round(h * (tv.videoWidth||16) / (tv.videoHeight||9)));
  const g = c.getContext('2d');
  for(let i=0;i<N;i++){
    if(tok !== stripTok) return;
    await new Promise(r => { tv.onseeked = r; tv.currentTime = Math.min(d - 0.05, (i+0.5)/N*d); });
    g.drawImage(tv, 0, 0, c.width, c.height);
    const im = new Image(); im.src = c.toDataURL('image/jpeg', 0.6); fr.appendChild(im);
  }
  tv.removeAttribute('src'); tv.load();
}
function updSel(){
  const d = v.duration || 1, s = +$('s').value, e = +$('e').value;
  $('sel').style.left = (s/d*100)+'%'; $('sel').style.width = ((e-s)/d*100)+'%';
  updPh();
}
function updPh(){
  const d = v.duration || 1;
  $('ph').style.left = 'calc('+(v.currentTime/d*100)+'% - 1px)';
  $('nowLbl').textContent = fmt(v.currentTime);
}
v.addEventListener('timeupdate', updPh); v.addEventListener('seeked', updPh);
const strip = $('strip');
const seekFromEv = ev => { const r = strip.getBoundingClientRect(); const x = Math.min(1, Math.max(0, (ev.clientX - r.left)/r.width)); v.currentTime = x * v.duration; };
strip.addEventListener('pointerdown', ev => { strip.setPointerCapture(ev.pointerId); v.pause(); seekFromEv(ev); strip.dragging = true; });
strip.addEventListener('pointermove', ev => { if(strip.dragging) seekFromEv(ev); });
strip.addEventListener('pointerup', () => { strip.dragging = false; });

function upd(src){
  let s = +$('s').value, e = +$('e').value;
  const gap = 0.2;
  if(src === 's' && s > e - gap) { s = Math.max(0, e - gap); $('s').value = s; }
  if(src === 'e' && e < s + gap) { e = Math.min(v.duration, s + gap); $('e').value = e; }
  $('sLbl').textContent = fmt(s); $('eLbl').textContent = fmt(e); $('dLbl').textContent = fmt(e - s); updSel();
}
$('s').addEventListener('input', () => { upd('s'); v.currentTime = +$('s').value; });
$('e').addEventListener('input', () => { upd('e'); v.currentTime = +$('e').value; });
$('setS').onclick = () => { $('s').value = Math.min(v.currentTime, +$('e').value - 0.2); upd('s'); };
$('setE').onclick = () => { $('e').value = Math.max(v.currentTime, +$('s').value + 0.2); upd('e'); };
$('prev').onclick = () => {
  const s = +$('s').value, e = +$('e').value;
  v.currentTime = s; v.play();
  const chk = () => { if(v.currentTime >= e || v.paused){ v.pause(); v.removeEventListener('timeupdate', chk);} };
  v.addEventListener('timeupdate', chk);
};

// file picking
const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
drop.onkeydown = ev => { if(ev.key==='Enter'||ev.key===' ') file.click(); };
file.onchange = () => loadFile(file.files[0]);
['dragover','dragenter'].forEach(n => drop.addEventListener(n, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(n => drop.addEventListener(n, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => loadFile(ev.dataTransfer.files[0]));
$('reset').onclick = () => {
  v.pause(); $('editor').classList.add('hide'); $('result').classList.add('hide');
  drop.classList.remove('hide'); file.value = '';
};

function pickMime(){
  const c = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}

$('go').onclick = async () => {
  if(busy) return;
  if(!window.MediaRecorder || !cv.captureStream){ $('hint').textContent = 'Este navegador no permite recortar acá. Probá con Chrome, Edge o Safari actualizado.'; return; }
  busy = true; $('go').disabled = true; $('prog').classList.remove('hide');
  const bar = $('prog').firstElementChild;
  const s = +$('s').value, e = +$('e').value;
  try{
    // audio graph (once)
    if(!actx){
      try{
        actx = new (window.AudioContext||window.webkitAudioContext)();
        asrc = actx.createMediaElementSource(v);
        adest = actx.createMediaStreamDestination();
        asrc.connect(adest);
      }catch(_){ actx = null; adest = null; }
    }
    if(actx && actx.state === 'suspended') await actx.resume();

    const scale = Math.min(1, 1280 / v.videoWidth);
    cv.width = Math.round(v.videoWidth * scale) & ~1;
    cv.height = Math.round(v.videoHeight * scale) & ~1;

    v.pause();
    await new Promise(r => { const h = () => { v.removeEventListener('seeked', h); r(); }; v.addEventListener('seeked', h); v.currentTime = s; });
    ctx2d.drawImage(v, 0, 0, cv.width, cv.height);

    const stream = cv.captureStream(30);
    if(adest) adest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const mime = pickMime();
    const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 5_000_000 } : undefined);
    const chunks = [];
    rec.ondataavailable = ev => { if(ev.data && ev.data.size) chunks.push(ev.data); };
    const done = new Promise(r => rec.onstop = r);

    rec.start(250);
    await v.play();
    let raf;
    await new Promise(res => {
      const loop = () => {
        ctx2d.drawImage(v, 0, 0, cv.width, cv.height);
        const p = (v.currentTime - s) / (e - s);
        bar.style.width = Math.min(100, Math.max(0, p*100)) + '%';
        if(v.currentTime >= e || v.ended || v.paused){ res(); return; }
        raf = requestAnimationFrame(loop);
      };
      loop();
    });
    cancelAnimationFrame(raf);
    v.pause();
    rec.stop();
    await done;
    stream.getTracks().forEach(t => t.stop());

    const type = (rec.mimeType || mime || 'video/webm').split(';')[0];
    outExt = type.includes('mp4') ? 'mp4' : 'webm';
    outBlob = new Blob(chunks, { type });
    const ru = URL.createObjectURL(outBlob);
    const rv = $('rv'); if(rv.dataset.u) URL.revokeObjectURL(rv.dataset.u);
    rv.src = ru; rv.dataset.u = ru;
    $('info').textContent = (outBlob.size/1048576).toFixed(1) + ' MB · .' + outExt;
    $('msg').textContent = '';
    $('result').classList.remove('hide');
    $('result').scrollIntoView({behavior:'smooth'});
  }catch(err){
    $('hint').textContent = 'Algo falló al recortar: ' + (err && err.message ? err.message : err);
  }finally{
    busy = false; $('go').disabled = false; $('prog').classList.add('hide'); $('prog').firstElementChild.style.width = '0';
  }
};

let dl = null;
try{ claude.use('downloads').then(d => { dl = d; }).catch(()=>{}); }catch(_){}

$('save').onclick = async () => {
  if(!outBlob) return;
  const name = baseName + '-recorte.' + outExt;
  const msg = $('msg');
  if(!dl){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(outBlob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = 'Descargando: ' + name;
    return;
  }
  try{
    await dl.save({ filename: name, data: outBlob });
    msg.textContent = 'Guardado: ' + name;
  }catch(err){
    msg.textContent = err && err.code === 'declined' ? 'Cancelaste la descarga.' : 'No se pudo descargar (' + (err && err.code || 'error') + ').';
  }
};
</script>
</body>
</html>
